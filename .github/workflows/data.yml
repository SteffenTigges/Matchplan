name: data

on:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/data.yml"
  workflow_dispatch:
  schedule:
    # Zeiten in UTC, läuft nur auf dem Hauptzweig.
    # Mo–Do zweimal täglich (≈ 6:17 und 17:17 Uhr deutscher Zeit)
    - cron: "17 5,16 * * 1-4"
    # Fr–So stündlich von ≈ 10:17 bis 22:17 Uhr (deckt die Zeit vor den Anstößen ab)
    - cron: "17 9-21 * * 5,6,0"

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}  # je Zweig eigene Warteschlange: Test-Läufe verdrängen nie den Lauf auf main

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e 'pipeline[dev]'

      - name: Tests
        run: pytest -q pipeline

      - name: Quellen-Check
        run: python -m matchplan_data.probe --out data/status/probe.json

      - name: Spielplan, Tabelle, Aufstellungen
        run: python -m matchplan_data.update --out data

      - name: Zusammenfassung
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/status/probe.json", encoding="utf-8"))
          print(f"### Quellen-Check: {r['ok_count']} von {r['total']} erreichbar\n")
          print("| Quelle | Ergebnis | HTTP | Zeit (ms) | Fehler |\n|---|---|---|---|---|")
          for s in r["sources"]:
              print(f"| {s['name']} | {'✅' if s['ok'] else '❌'} | {s['status'] or '-'} | {s['elapsed_ms'] or '-'} | {s['error'] or ''} |")
          PY

      - name: Ergebnis speichern (nur Hauptzweig)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "data: Aktualisierung"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi
