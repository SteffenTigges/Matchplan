name: data

on:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/data.yml"
  workflow_dispatch:
  schedule:
    # 05:17 und 17:17 UTC (läuft nur auf dem Hauptzweig)
    - cron: "17 5,17 * * *"

permissions:
  contents: write

concurrency: data

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e 'pipeline[dev]'

      - name: Tests
        run: pytest -q pipeline

      - name: Quellen-Check
        run: python -m matchplan_data.probe --out data/status/probe.json

      - name: Zusammenfassung
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/status/probe.json", encoding="utf-8"))
          print(f"### Quellen-Check: {r['ok_count']} von {r['total']} erreichbar\n")
          print("| Quelle | Ergebnis | HTTP | Zeit (ms) | Fehler |\n|---|---|---|---|---|")
          for s in r["sources"]:
              print(f"| {s['name']} | {'✅' if s['ok'] else '❌'} | {s['status'] or '-'} | {s['elapsed_ms'] or '-'} | {s['error'] or ''} |")
          PY

      - name: Ergebnis speichern (nur Hauptzweig)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/probe.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "data: Quellen-Check"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi
