name: live

# Liveticker: Eine Sitzung holt jede Minute die laufenden Spiele, bis keins mehr läuft oder bald beginnt.
# Gestartet vom stündlichen Datenabruf (zuverlässig) und zusätzlich per Zeitplan; ohne Spiel endet sie nach Sekunden.
# Nach jedem Abpfiff startet sie den großen Datenabruf, damit Statistik, Tabelle und alles Abgeleitete sofort nachziehen.
on:
  schedule:
    - cron: "*/5 11-22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-${{ github.ref }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e pipeline

      - name: Live-Sitzung (jede Minute, bis kein Spiel mehr läuft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python -m matchplan_data.live --out data --session --commit
          else
            python -m matchplan_data.live --out data
          fi
